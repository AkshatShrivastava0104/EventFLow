
services:
  postgres:
    image: postgres:17
    container_name: eventflow_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - eventflow_network

  redis:
    image: redis:8-alpine
    container_name: eventflow_redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - eventflow_network

  migrate:
    image: migrate/migrate:v4.18.3
    command:
      - -path=/migrations
      - -database
      - postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      - up
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - eventflow_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: eventflow-api:local
    container_name: eventflow_backend
    restart: unless-stopped

    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      PORT: ${PORT}
      METRICS_ADDR: ":9090"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://eventflowak.vercel.app}

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      JWT_SECRET: ${JWT_SECRET}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_UPLOAD_FOLDER: ${CLOUDINARY_UPLOAD_FOLDER:-uploads/events}

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 -O /dev/null http://127.0.0.1:8080/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - eventflow_network

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: eventflow_prometheus
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    expose:
      - "9090"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - eventflow_network

  grafana:
    image: grafana/grafana:12.2.1
    container_name: eventflow_grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana

    expose:
      - "3000"

    depends_on:
      - prometheus

    networks:
      - eventflow_network

networks:
  eventflow_network:
    external: true
    name: eventflow_default

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
